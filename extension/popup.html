<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MPV Launcher</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="app-header">
    <div class="logo-area">
      <span class="mpv-icon">▶</span>
      <h1>MPV Launcher</h1>
    </div>
    <div class="header-right">
      <span id="media-count-badge" class="badge">0 found</span>
      <a href="https://github.com/vegasline/MPVLauncher" target="_blank" class="gh-link" title="Download / GitHub">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.868-.013-1.703-2.782.604-3.369-1.342-3.369-1.342-.454-1.154-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.087.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.744 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
        </svg>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" class="dl-arrow">
          <path d="M12 16l-6-6h4V4h4v6h4l-6 6zm-7 2h14v2H5v-2z"/>
        </svg>
      </a>
    </div>
  </header>

  <main class="container">
    <section class="main-action-card">
      <div class="page-info">
        <span class="label">Active page:</span>
        <span id="current-page-title" class="title">Loading...</span>
      </div>
      <button id="btn-play-page" class="btn btn-primary" title="Open the current page URL in MPV">
        <span class="btn-icon">⚡</span> Open page in MPV
      </button>
    </section>

    <section class="links-section">
      <div class="section-header">
        <h2>Detected media</h2>
        <button id="btn-rescan" class="btn-icon-only" title="Scan again">🔄</button>
      </div>

      <div id="loading-spinner" class="loading hidden">
        <div class="spinner"></div>
        <p>Scanning page...</p>
      </div>

      <div id="empty-state" class="empty-state hidden">
        <p>No embedded video or iframe was found on this page.</p>
        <small>You can still open the page URL with the button above.</small>
      </div>

      <ul id="media-list" class="media-list"></ul>
    </section>
  </main>

  <footer class="app-footer">
    <div id="status-message" class="status-message">Ready</div>
  </footer>

  <script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MPV Launcher</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="app-header">
    <div class="logo-area">
      <span class="mpv-icon">▶</span>
      <h1>MPV Launcher</h1>
    </div>
    <div class="header-right">
      <span id="media-count-badge" class="badge">0 found</span>
      <button id="btn-toggle-settings" class="btn-icon-only" title="Settings" aria-label="Settings">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
      </button>
      <a href="https://github.com/vegasline/MPVLauncher" target="_blank" class="gh-link" title="Download / GitHub">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.868-.013-1.703-2.782.604-3.369-1.342-3.369-1.342-.454-1.154-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.087.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.744 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
        </svg>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" class="dl-arrow">
          <path d="M12 16l-6-6h4V4h4v6h4l-6 6zm-7 2h14v2H5v-2z"/>
        </svg>
      </a>
    </div>
  </header>

  <div id="settings-panel" class="settings-panel hidden">
    <div class="setting-row">
      <label id="lbl-language" for="select-language">Language:</label>
      <select id="select-language" class="select-dropdown"></select>
    </div>
    <div class="setting-row">
      <label id="lbl-badge-counter" for="chk-badge-counter">Show badge counter on icon</label>
      <input type="checkbox" id="chk-badge-counter" checked>
    </div>

    <div class="setting-row theme-row">
      <label id="lbl-theme">Theme</label>
      <div id="theme-swatches" class="theme-swatches" role="group"></div>
      <button id="btn-theme-random" class="theme-random" type="button" title="Random colours">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true">
          <path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm0 2v14h14V5H5zm2.5 2a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm9 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zM9.5 14a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm5 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/>
        </svg>
      </button>
    </div>

    <div class="filter-section">
      <span id="lbl-filter-title" class="filter-section-title">Filters</span>
      <div class="filter-chips">
        <button id="chip-streams" class="filter-chip active" type="button">HLS / DASH</button>
        <button id="chip-files" class="filter-chip active" type="button">Video files</button>
        <button id="chip-iframes" class="filter-chip active" type="button">Iframes</button>
      </div>
      <div class="setting-row">
        <label id="lbl-min-size" for="input-min-size">Min. file size (KB)</label>
        <input type="number" id="input-min-size" class="text-input-small" min="0" step="64" value="0">
      </div>
      <div class="setting-row">
        <label id="lbl-hide-dead" for="input-hide-dead">Hide dead links</label>
        <input type="checkbox" id="input-hide-dead">
      </div>
      <div class="setting-row" style="flex-direction: column; align-items: stretch; gap: 6px;">
        <label id="lbl-blacklist" for="input-blacklist">Ignore strings (comma separated)</label>
        <input type="text" id="input-blacklist" class="text-input-wide" placeholder="ads, tracker.example.com">
      </div>
      <p id="lbl-filter-note" class="filter-note"></p>
    </div>
  </div>

  <main class="container">
    <section class="main-action-card">
      <div class="page-info">
        <span id="lbl-active-page" class="label">Active page:</span>
        <span id="current-page-title" class="title">Loading...</span>
      </div>
      <button id="btn-play-page" class="btn btn-primary" title="Open the current page URL in MPV">
        <span class="btn-icon"></span> <span id="btn-play-page-text">Open page in MPV</span>
      </button>
    </section>

    <section class="links-section">
      <div class="section-header">
        <h2 id="lbl-detected-media">Detected media</h2>
        <button id="btn-rescan" class="btn-icon-only" title="Scan again">🔄</button>
      </div>

      <div id="loading-spinner" class="loading hidden">
        <div class="spinner"></div>
        <p id="lbl-scanning">Scanning page...</p>
      </div>

      <div id="empty-state" class="empty-state hidden">
        <p id="lbl-empty-main">No embedded video or iframe was found on this page.</p>
        <small id="lbl-empty-sub">You can still open the page URL with the button above.</small>
      </div>

      <ul id="media-list" class="media-list"></ul>
    </section>
  </main>

  <footer class="app-footer">
    <div id="status-message" class="status-message">Ready</div>
  </footer>

  <!-- media_types.js first: it declares the type ids, and popup.js asks it for
       a type's label, colour and filter category rather than keeping its own
       copy of that list. -->
  <script src="media_types.js"></script>
  <script src="i18n.js"></script>
  <script src="stream_meta.js"></script>
  <script src="themes.js"></script>
  <script src="popup.js"></script>
</body>
</html>

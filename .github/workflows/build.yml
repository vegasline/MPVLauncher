name: Build and Release MPVLauncher

on:
  push:
    tags:
      - 'v*'
      - 'beta-*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Single-File Exe Derleme (~4MB)
    - name: Publish MPVLauncher
      run: |
        $csproj = Get-ChildItem -Filter MpvLauncher.Gui.csproj -Recurse | Select-Object -First 1
        dotnet publish $csproj.FullName -c Release -r win-x64 --self-contained false `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -o ./publish

    # Her yapılandırma kontrolü için Artifacts yüklemesi
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MPVLauncher-Executable
        path: ./publish/MPVLauncher.exe

    # Yalnızca Versiyon Etiketi (Tag) basıldığında Release Oluşturur
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: MPVLauncher ${{ github.ref_name }}
        files: ./publish/MPVLauncher.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
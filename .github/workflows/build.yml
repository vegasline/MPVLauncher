name: Build and Release MPVLauncher

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
      - 'beta-*'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # .NET 10 SDK Kurulumu
    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Bağımlılıkları Yükle
    - name: Restore Dependencies
      working-directory: ./MpvLauncher.Gui
      run: dotnet restore

    # Projeyi Tek Parça (.exe) Olarak Derle
    - name: Publish Application
      working-directory: ./MpvLauncher.Gui
      run: |
        dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ../publish
        
    # Çıktıları Zip Formatına Getir
    - name: Compress Build Artifacts
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath MPVLauncher-win-x64.zip

    # 1. Her Build Sonrası Zip Dosyasını Artifact Olarak Sakla
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MPVLauncher-Executable
        path: MPVLauncher-win-x64.zip

    # 2. Tag (Etiket) Gönderildiyse Otomatik GitHub Release Oluştur
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: MPVLauncher-win-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Build and Release MPVLauncher

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
      - 'beta-*'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Projeyi arayıp bulur ve tam tek dosya (.exe) olarak publish eder
    - name: Publish Single File Exe
      run: |
        $csproj = Get-ChildItem -Filter MpvLauncher.Gui.csproj -Recurse | Select-Object -First 1
        dotnet publish $csproj.FullName -c Release -r win-x64 --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true `
          -p:PublishReadyToRun=false `
          -o ./publish

    # Sadece üretilen .exe dosyasını zip paketine koyar (yanındaki ek DLL/JSON birikintilerini almaz)
    - name: Compress Executable
      run: |
        Compress-Archive -Path ./publish/MPVLauncher.exe -DestinationPath MPVLauncher-win-x64.zip

    # 1. Artifact olarak tek dosyayı ve Zip'i yükle
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MPVLauncher-Executable
        path: |
          ./publish/MPVLauncher.exe
          MPVLauncher-win-x64.zip

    # 2. Tag atıldıysa Release kısmına hem MPVLauncher.exe hem de ZIP dosyasını ekle
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./publish/MPVLauncher.exe
          MPVLauncher-win-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
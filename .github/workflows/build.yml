name: Build and Release MPVLauncher

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
      - 'beta-*'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Visual Studio Publish Profil Ayarlarının Tam Karşılığı (~4MB Single-File Exe)
    - name: Publish MPVLauncher
      run: |
        $csproj = Get-ChildItem -Filter MpvLauncher.Gui.csproj -Recurse | Select-Object -First 1
        dotnet publish $csproj.FullName -c Release -r win-x64 --self-contained false `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true `
          -o ./publish

    # GitHub Artifacts (Doğrudan MPVLauncher.exe)
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MPVLauncher-Executable
        path: ./publish/MPVLauncher.exe

    # Releases Sekmesine Otomatik Gönderim (Doğrudan MPVLauncher.exe)
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        files: ./publish/MPVLauncher.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
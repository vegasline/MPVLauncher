name: Build and Release MPVLauncher

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
      - 'beta-*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # The extension and locale suites are pure Node and need no SDK, so they run
    # as their own job: they fail in seconds and say exactly which file broke,
    # rather than being discovered at the end of a publish.
    name: Tests
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # 166 checks: media classification, the native message payload, the
    # Firefox event-page restart, and the rule that no extension file evaluates
    # page-supplied code.
    - name: Extension tests
      run: node tools/extension-tests.js

    # 40 checks: every locale parses, all twelve share one key set, and no key
    # the C# looks up is missing from a translation.
    - name: Locale tests
      run: node tools/locale-tests.js

    # The C# suite pins the on-disk layout and the modules that already accept
    # their directories. It exists because the layout used to be static, which
    # meant nothing in the app could be pointed at a scratch folder - so nothing
    # in it could be tested at all.
    - name: C# tests
      run: dotnet test MpvLauncher.Gui.Tests/MpvLauncher.Gui.Tests.csproj -c Release --nologo

    # extension/manifest.json is what gets zipped and submitted to
    # addons.mozilla.org, so it has to load in Firefox. It declared a
    # background service worker, which Firefox refuses outright - the add-on
    # simply does not load - and web-ext lint is Mozilla's own answer to
    # whether a manifest is shippable. The one remaining warning is about
    # Firefox for Android, a platform this extension does not target: it
    # launches a Windows executable.
    - name: web-ext lint
      run: npx --yes web-ext@latest lint --source-dir extension

  build:
    name: Build desktop app
    runs-on: windows-latest
    needs: test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Release notes are generated from the full history, so tags must exist
        # locally too.
        fetch-depth: 0

    - name: Install .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Single-file executable, framework-dependent. The extension is embedded as
    # manifest resources at this point, so a change under extension/ only ships
    # if this step runs - which is why it is part of the release path and not a
    # separate manual step.
    - name: Publish MPVLauncher
      run: |
        dotnet publish MpvLauncher.Gui/MpvLauncher.Gui.csproj `
          -c Release -r win-x64 --self-contained false `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -o ./publish

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: MPVLauncher-Executable
        path: ./publish/MPVLauncher.exe

    # The app checks for updates and verifies what it downloads against this
    # file, so it is built here rather than produced by the updater's own
    # download: a checksum written by whoever supplied the binary proves
    # nothing. Get-FileHash is SHA-256, which is what the app reads back.
    - name: Write checksum
      run: |
        $hash = (Get-FileHash ./publish/MPVLauncher.exe -Algorithm SHA256).Hash.ToLower()
        "$hash  MPVLauncher.exe" | Out-File -FilePath ./publish/MPVLauncher.exe.sha256 -Encoding ascii -NoNewline

    - name: Upload checksum artifact
      uses: actions/upload-artifact@v4
      with:
        name: MPVLauncher-Checksum
        path: ./publish/MPVLauncher.exe.sha256

  release:
    name: Create GitHub release
    # Tags only: a plain push to main builds and tests but publishes nothing.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    # The release body is a file in the repository, and so is the checksum
    # path the notes refer to, so this job needs the tree even though every
    # binary it publishes arrives as an artifact.
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: MPVLauncher-Executable
        path: ./dist

    - name: Download checksum artifact
      uses: actions/download-artifact@v4
      with:
        name: MPVLauncher-Checksum
        path: ./dist

    # The release body is written by hand and committed, because a generated
    # list of commit subjects does not tell a reader which of the fixes change
    # what they see. The file is release-notes/<tag>.md, so cutting a release
    # means writing its notes before pushing its tag - checked below rather than
    # left to fail with an unhelpful "file not found" from the action.
    - name: Release notes must exist for this tag
      run: |
        $notes = "release-notes/${{ github.ref_name }}.md"
        if (-not (Test-Path $notes)) {
          Write-Error "Missing $notes. Write the release notes before pushing the tag."
        }
        Get-Content $notes -TotalCount 1

    # Both assets travel together. An update that finds the executable but not
    # the checksum is refused rather than applied unverified.
    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./dist/MPVLauncher.exe
          ./dist/MPVLauncher.exe.sha256
        body_path: release-notes/${{ github.ref_name }}.md
